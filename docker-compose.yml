# ─────────────────────────────────────────────────────────────────────────────
# Phase 6 — OmniFlow Full-Stack Local Development Stack
#
# Services:
#   backend   — Express API + SSE event bus (port 5000)
#   frontend  — Vite dev server with HMR (port 3000)
#   mongo     — MongoDB 7 for persistent data (port 27017)
#   redis     — Redis 7 for SSE Pub/Sub backplane (port 6379)
#
# Usage:
#   docker compose up           # start all services
#   docker compose up backend   # start only the API server
#   docker compose down -v      # stop and remove volumes
# ─────────────────────────────────────────────────────────────────────────────

version: '3.9'

services:

  # ── MongoDB ───────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: omniflow_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: omniflow_user
      MONGO_INITDB_ROOT_PASSWORD: omniflow_dev_pass
      MONGO_INITDB_DATABASE: omniflow_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - omniflow_net

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: omniflow_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omniflow_net

  # ── Express Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniflow_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://omniflow_user:omniflow_dev_pass@mongo:27017/omniflow_db?authSource=admin
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ALLOWED_ORIGINS: http://localhost:3000
      CSRF_SECRET: ${CSRF_SECRET:-dev-csrf-secret}
    command: npm run dev
    volumes:
      - ./backend:/app
      - /app/node_modules      # preserve container node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/api/health']
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - omniflow_net

  # ── Vite Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omniflow_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
      VITE_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - omniflow_net

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  omniflow_net:
    driver: bridge
